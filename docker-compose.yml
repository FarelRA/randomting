version: '3.8'

services:
  randomting:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3100
      - SOCKET_PORT=3101
      - DB_URL=file:./data/sqlite.db
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    volumes:
      - randomting-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    depends_on:
      - randomting
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  randomting-data:
